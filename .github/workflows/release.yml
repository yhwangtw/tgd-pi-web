name: Release

run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'UTC date tag to create (e.g. v2026.07.19 or v2026.07.19-1)'
        required: true
      expected_sha:
        description: 'Full main/tag SHA reviewed in preflight; fail if it moved'
        required: false

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require main workflow branch
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The verifier comes from main, including when resuming an old tag.
          ref: main
          fetch-depth: 0

      - name: Verify exact source and completed CI
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/verify-release-source.mjs

      - name: Prepare release commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
          VERSION: ${{ steps.gate.outputs.version }}
          VERIFIED_SHA: ${{ steps.gate.outputs.source_sha }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_VERSION=$(git show "$TAG:package.json" | node -p \
              "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version")
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "Tag $TAG exists but contains package version $TAG_VERSION" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$TAG^{commit}" origin/main; then
              echo "Tag $TAG is not reachable from main" >&2
              exit 1
            fi
            echo "Tag $TAG already exists with the expected version; resuming release creation."
            exit 0
          fi

          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"

          VERSION="$VERSION" node <<'NODE'
          const fs = require('node:fs');

          const version = process.env.VERSION;
          for (const file of ['package.json', 'package-lock.json']) {
            const contents = JSON.parse(fs.readFileSync(file, 'utf8'));
            contents.version = version;
            if (file === 'package-lock.json' && contents.packages?.['']) {
              contents.packages[''].version = version;
            }
            fs.writeFileSync(file, `${JSON.stringify(contents, null, 2)}\n`);
          }
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: release $TAG [skip ci]"
          fi

          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin HEAD:main "refs/tags/$TAG"

      - name: Generate categorized changelog
        env:
          VERSION: ${{ steps.gate.outputs.tag }}
          VERIFIED_SHA: ${{ steps.gate.outputs.source_sha }}
          CI_SHA: ${{ steps.gate.outputs.ci_sha }}
          CI_URL: ${{ steps.gate.outputs.ci_url }}
          PR_CI_URL: ${{ steps.gate.outputs.pr_ci_url }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
        run: |
          node scripts/release-notes.mjs

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.gate.outputs.tag }}" >/dev/null 2>&1; then
            echo "GitHub Release already exists: ${{ steps.gate.outputs.tag }}"
            exit 0
          fi

          # A historical recovery must not replace a newer calendar release
          # as latest, including a later sequence on the same UTC date.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/published-releases.json
          LATEST=$(node scripts/release-latest.mjs "${{ steps.gate.outputs.tag }}" /tmp/published-releases.json)
          gh release create "${{ steps.gate.outputs.tag }}" \
            --verify-tag \
            --title "tGD-pi-web ${{ steps.gate.outputs.tag }}" \
            --notes-file /tmp/release-notes.md \
            --latest="$LATEST"
