name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.scope.outputs.profile }}
      reuse: ${{ steps.scope.outputs.reuse }}
      runtime: ${{ steps.scope.outputs.runtime }}
      install: ${{ steps.scope.outputs.install }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - id: scope
        run: node scripts/ci-scope.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  reuse:
    name: Reuse reviewed checks
    needs: scope
    if: needs.scope.outputs.reuse == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/ci-scope.mjs --verify-reuse
        env:
          GH_TOKEN: ${{ github.token }}

  docs:
    name: Documentation checks
    needs: scope
    if: needs.scope.outputs.profile == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/ci-scope.mjs --check-docs

  lint:
    needs: scope
    if: needs.scope.outputs.profile != 'docs' && needs.scope.outputs.reuse != 'true'
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Release verifies this exact PR tree against the merged source.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: node_modules/.bin/tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Design-system contract
        run: npm run audit:design

      - name: Localization contract
        run: npm run audit:i18n

      - name: Capability documentation contract
        run: npm run audit:capabilities

  runtime-tests:
    needs: scope
    if: needs.scope.outputs.profile != 'docs' && needs.scope.outputs.reuse != 'true'
    name: Runtime tests (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.runtime) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Release verifies this exact PR tree against the merged source.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Verify actual Node runtime
        run: node scripts/check-node-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  installation-smoke:
    needs: scope
    if: needs.scope.outputs.profile != 'docs' && needs.scope.outputs.reuse != 'true'
    name: Archive and offline setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.install) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Release verifies this exact PR tree against the merged source.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies and prewarm the platform npm cache
        run: npm ci

      - name: Build source archive and offline checkout in isolated directories
        run: node scripts/ci-install-smoke.mjs

  # Stable aggregate: every selected check must pass; skipped checks cannot stand
  # in for a failed selection or an unverified reuse attempt.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [scope, runtime-tests, installation-smoke, reuse, docs]
    if: ${{ always() }}
    steps:
      - name: Require selected results
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          PROFILE: ${{ needs.scope.outputs.profile }}
          REUSE: ${{ needs.scope.outputs.reuse }}
          RUNTIME_RESULT: ${{ needs.runtime-tests.result }}
          INSTALL_RESULT: ${{ needs.installation-smoke.result }}
          REUSE_RESULT: ${{ needs.reuse.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$PROFILE" = docs ]; then
            test "$DOCS_RESULT" = success
          elif [ "$REUSE" = true ]; then
            test "$REUSE_RESULT" = success
          else
            test "$RUNTIME_RESULT" = success
            test "$INSTALL_RESULT" = success
          fi

  build:
    needs: scope
    if: needs.scope.outputs.profile != 'docs' && needs.scope.outputs.reuse != 'true'
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Release verifies this exact PR tree against the merged source.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Initial JavaScript budget
        run: npm run audit:js-budget

  e2e:
    needs: scope
    if: needs.scope.outputs.profile != 'docs' && needs.scope.outputs.reuse != 'true'
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Release verifies this exact PR tree against the merged source.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # @playwright/test is deliberately not a devDependency: its transitive
      # postinstall downloads browser binaries, which breaks offline/Nexus
      # installs at the company. CI installs it ad hoc without touching
      # package.json / package-lock.json.
      - name: Install Playwright (not in package.json — offline installs)
        run: npm i -D --no-save @playwright/test

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    needs: scope
    if: needs.scope.outputs.profile != 'docs' && needs.scope.outputs.reuse != 'true'
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Release verifies this exact PR tree against the merged source.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit (high+critical only)
        run: npm run audit:production
