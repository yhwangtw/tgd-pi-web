name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: node_modules/.bin/tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Design-system contract
        run: npm run audit:design

      - name: Localization contract
        run: npm run audit:i18n

      - name: Capability documentation contract
        run: npm run audit:capabilities

  runtime-tests:
    name: Runtime tests (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.19.0', '23.4.0', '24']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Verify actual Node runtime
        run: node scripts/check-node-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  installation-smoke:
    name: Archive and offline setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies and prewarm the platform npm cache
        run: npm ci

      - name: Build source archive and offline checkout in isolated directories
        run: node scripts/ci-install-smoke.mjs

  # Keep this exact name: the source-release gate requires one successful Test
  # job. Failed, skipped or cancelled matrix cells must never inherit a green gate.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [runtime-tests, installation-smoke]
    if: ${{ always() }}
    steps:
      - name: Require every runtime and installation result
        env:
          RUNTIME_RESULT: ${{ needs.runtime-tests.result }}
          INSTALL_RESULT: ${{ needs.installation-smoke.result }}
        run: |
          test "$RUNTIME_RESULT" = success
          test "$INSTALL_RESULT" = success

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Initial JavaScript budget
        run: npm run audit:js-budget

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # @playwright/test is deliberately not a devDependency: its transitive
      # postinstall downloads browser binaries, which breaks offline/Nexus
      # installs at the company. CI installs it ad hoc without touching
      # package.json / package-lock.json.
      - name: Install Playwright (not in package.json — offline installs)
        run: npm i -D --no-save @playwright/test

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit (high+critical only)
        run: npm run audit:production
